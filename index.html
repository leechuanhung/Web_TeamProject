<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>국민대학교 편의시설과 공간</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>

  <!-- 공통 헤더 -->
  <header>

    <h1>
      <a href="index.html">
        <!-- <img src="" alt="로고"> -->
      </a>
    </h1>

    <nav>
      <ul>
        <li><a href="index.html">메인 페이지</a></li>
        <li><a href="restaurants.html">주변 맛집</a></li>
        <li><a href="team.html">팀원 소개</a></li>
        <li><a href="game.html">게임</a></li>
        <li><a href="form.html">폼</a></li>
      </ul>
    </nav>

  </header>

  <!-- 메인 페이지 -->
  <main>

    <div class="explain">

      <img class="explain-img" src="./images/쿠민1.png">

      <div class="explain-text">
        <h2>국민대 편의시설을 한눈에!</h2>
        <p>장소 추가 또는 건의사항이 있다면 문의해주세요</p>
      </div>
    </div>

    <!-- 지도 -->
    <section class="map-section">

      <div class="map-elements">

        <!-- 지도 이미지 -->
        <img class="map" src="./images/map.png" alt="캠퍼스 지도">

        <!-- 미래관 -->
        <div class="map-place map-place-mirae">
          
          <button class="map-marker" type="button">
            <img src="./images/map_marker.png" alt="미래관">
          </button>

          <aside class="details">
            <div class="details-header">
              <h3>미래관</h3>
              <button class="close-details" type="button">X</button>
            </div>

            <div class="details-body">
              <article class="place">
                <h4>자율주행스튜디오</h4>
                <p>4F</p>
                <p>소융대 학생들의 모임장소</p>
              </article>

              <article class="place">
                <h4>무한상상실</h4>
                <p>4F</p>
                <p>적당한 소음의 공부 공간</p>
              </article>
            </div>
          </aside>

        </div>

      </div>

    </section>

    

  </main>

  <!-- 하단 영역 -->
  <footer>
    <p>
      웹클 1분반 1조 프로젝트
    </p>
  </footer>

</body>
</html>
